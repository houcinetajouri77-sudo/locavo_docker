name: CI/CD Pipeline Locavo

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code source
        uses: actions/checkout@v3

      - name: Verifier la syntaxe PHP (Linting)
        run: |
          echo "Vérification des fichiers PHP..."
          for file in $(find locavo-docker -name "*.php"); do
            php -l $file || exit 1
          done
          echo "Tout le code PHP est correct !"

      - name: Connexion a Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build et Push de l'image Docker
        uses: docker/build-push-action@v4
        with:
          context: ./locavo-docker
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/locavo-app:latest